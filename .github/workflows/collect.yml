# GroundRooted 수집기 — 6시간마다 + 수동 실행 가능
# 필요 Secrets (저장소 Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (필수)
#   GH_PAT                                    (다른 저장소 읽기용 Personal Access Token)
#   YOUTUBE_API_KEY, YT_CHANNEL_ID            (유튜브 수집 시)
name: collect
on:
  schedule:
    - cron: "17 */6 * * *" # 6시간마다 (UTC)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 의존성 0 — npm install 불필요
      - name: GitHub 프로젝트 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: node collectors/collect-github.mjs
      - name: YouTube 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: node collectors/collect-youtube.mjs
