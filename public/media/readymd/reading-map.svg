<g font-family="sans-serif" text-anchor="middle">
<g fill="#fff"><rect x="34" y="57" width="190" height="188" rx="8"/><rect x="265" y="57" width="190" height="188" rx="8"/><rect x="496" y="57" width="190" height="188" rx="8"/></g>
<g fill="#1657e8" font-size="16"><text x="129" y="100">01</text><text x="360" y="100">02</text><text x="591" y="100">03</text></g>
<g fill="#1c2c46" font-size="29" font-weight="600"><text x="129" y="150">읽기</text><text x="360" y="150">메모</text><text x="591" y="150">연결</text></g>
<g fill="#53627a" font-size="16"><text x="129" y="192">문장을 발견하다</text><text x="360" y="192">나의 질문을 더하다</text><text x="591" y="192">다음 생각을 만들다</text></g>
